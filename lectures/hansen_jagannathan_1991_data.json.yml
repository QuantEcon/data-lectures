# Manifest for hansen_jagannathan_1991_data.json — migrated out of
# QuantEcon/lecture-python-advanced.myst, where it sat at
# lectures/_static/lecture_specific/hansen_jagannathan_1991/ and was already
# read over that repo's own raw URL (PLAN Phase 8, wave C1).
#
# READ THE `source` NOTE FIRST. These are NOT Hansen and Jagannathan's data.
# The paper is the specification being replicated; every number here is a
# modern reconstruction from Robert Shiller's public workbooks and from FRED,
# standing in for the CRSP/Fama return and bill files the authors used. The
# lecture says so itself ("our FRED proxy differs from the original CRSP bill
# data", "FRED proxy data"). A reader who takes this file for the paper's
# dataset will misread every number in it.
#
# THE `monthly.cons_ratio` COLUMN IS MISLABELLED AND IS NOT CONSUMPTION. It is
# the growth rate of (DNDGRG3M086SBEA + DSERRG3M086SBEA) / POPTHM — the sum of
# two chain-type PRICE indices divided by population, i.e. roughly PCE
# inflation minus population growth. No lecture reads it (verified by grep:
# the only reads of the monthly table are `stock` and `bill`), so nothing
# published today is wrong because of it — but it must not be adopted by a new
# consumer as written. See `schema.tables[monthly]` and the open item at the
# foot of this file.
#
# FIRST .json in the published tree. `schema.format` is free-form and
# unvalidated — nothing in scripts/ or .github/scripts/ reads `format`,
# `columns` or `tables` — and build_audit.py's DATA_EXT already admits
# ".json", so this file needs no tooling change. The `tables:` block below is
# a three-table analogue of the `sheets:` structure the Excel manifests use
# (dette.xlsx.yml, mpd2020.xlsx.yml): `schema.columns` models one flat table
# and cannot express a bundle.

filename: hansen_jagannathan_1991_data.json
title: Hansen-Jagannathan (1991) replication — US asset returns 1891-1986, with annual consumption (three-table bundle)
description: >
  A three-table bundle serving the `hansen_jagannathan_1991` lecture: `annual`
  (gross real stock and one-year bond returns plus a real per-capita
  consumption level, 1891-1985), `monthly` (gross real stock and Treasury-bill
  returns, 1959:3-1986:12), and `quarterly` (gross real three-month
  holding-period returns on 3-, 6-, 9- and 12-month bills, observed monthly
  1964:7-1986:12). Every column is a gross ratio near 1, not a percentage and
  not a net return — except `annual.consumption`, which is a level, and
  `annual.year`. Reconstructed from Shiller's workbooks and FRED rather than
  taken from the paper — see the source note.

# Constructed: every value is computed from upstream series by our processing.
# Nothing here is republished as distributed — with the single exception noted
# under `license`, that `annual.bond` reproduces 95 values of one Shiller
# column unchanged.
class: constructed

source:
  name: Robert J. Shiller's public data workbooks (chapt26.xlsx, ie_data.xls) and FRED
  url: http://www.econ.yale.edu/~shiller/data.htm
  doi: null                     # neither provider issues one for these series
  version: >
    Shiller's workbooks are undated, unversioned and updated in place. As read
    on 2026-08-17: chapt26.xlsx, 108,566 B, sha256
    d255bb1230a9a94c450ee4738d914ec8c6c79ceae58f1cc89559c7f40fa7c9c0;
    ie_data.xls, 1,628,672 B, sha256
    0df9392b7dacf91f756e92c8db508ad903c4588b43f3253680eec3dd8b40db68. FRED
    series are unversioned and revisable; the 1891-1986 windows used here
    reproduced exactly on that date (see integrity.upstream).
  series: >
    Shiller chapt26.xlsx, sheet `Data`: column P "Return on S&P Composite"
    (annual real total return), column H "RealR" (real one-year interest
    rate, gross), column I "C" (real per-capita consumption, chained 2005
    dollars);
    Shiller ie_data.xls, sheet `Data`: column J "Real Total Return Price"
    (monthly);
    FRED TB3MS (3-month Treasury bill secondary market rate, monthly);
    FRED TB6MS (6-month Treasury bill secondary market rate, monthly);
    FRED GS1 (1-year Treasury constant maturity rate, monthly);
    FRED CPIAUCSL (CPI-U all items, SA, 1982-84=100);
    FRED DNDGRG3M086SBEA and DSERRG3M086SBEA (PCE chain-type PRICE indices,
    nondurable goods and services, 2017=100, SA, BEA);
    FRED POPTHM (US population, monthly, thousands).
  citation: >
    Constructed by QuantEcon from Robert J. Shiller's public stock-market and
    consumption workbooks (Yale University) and from Board of Governors, BLS,
    BEA and Census series retrieved via FRED (Federal Reserve Bank of St.
    Louis). Replicates the empirical exhibits of Hansen, Lars Peter, and Ravi
    Jagannathan. 1991. "Implications of Security Market Data for Models of
    Dynamic Economies." Journal of Political Economy 99 (2): 225-262.
    doi:10.1086/261749.
  note: >
    NOT the authors' data, and not a faithful copy of it. Hansen and
    Jagannathan used CRSP value-weighted NYSE returns, the Fama Treasury bill
    term-structure files, and NIPA consumption; CRSP is a paid subscription
    product, so every leg here is a public substitute. The annual stock leg is
    Shiller's S&P Composite real total return, the annual bond leg is his real
    one-year rate, the monthly stock leg is his Irrational Exuberance real
    total-return index, and the bill legs are built from FRED yields deflated
    by CPIAUCSL. The quarterly table has no 9-month upstream at all: its 9-month
    yield is the arithmetic mean of TB6MS and GS1 — an interpolation of ours,
    not a published series. The lecture states the consequence plainly at two
    places ("Because our FRED proxy differs from the original CRSP bill data,
    the levels differ slightly, but the qualitative features match"; "Here we
    use just the 2 base payoffs (stock and bill returns) from FRED proxy
    data"). The paper is the specification; the bytes are ours.

license:
  name: null
  url: http://www.econ.yale.edu/~shiller/data.htm
  # Recorded as found, per the record-and-track policy (AGENTS.md, "Licensing
  # and attribution"). Split answer across the two providers, and neither half
  # has a licence to name.
  redistribution: permitted
  verified: 2026-08-17
  note: >
    The seven FRED inputs are U.S. federal statistics — Board of Governors
    H.15 Treasury rates, the BLS consumer price index, BEA PCE price indices
    and the BEA/Census population series — which are U.S. Government works in
    the public domain; FRED is the delivery channel, not the rights holder,
    and none is among the third-party series FRED re-serves under restriction.
    Shiller's data page states NO licence, NO redistribution terms and carries
    no copyright notice (checked 2026-08-17); ie_data.xls ships a `Disclaimer`
    sheet whose only content is an accuracy disclaimer ("developed by Robert
    J. Shiller using various public sources. Neither Robert J. Shiller nor any
    affiliates or consultants ... guarantee the accuracy or completeness"), not
    a grant. `permitted` therefore rests on what is actually published here.
    The six FRED-derived columns are transformed past recovery, and
    `monthly.stock` publishes only ratios of a level index. The four `annual`
    columns are the exposure, and it is worth naming precisely: `annual.bond`
    reproduces 95 values of Shiller's chapt26 `RealR` column unchanged
    (bit-identical, measured 2026-08-17), `annual.stock` is one addition away
    from his `Return` column, `annual.year` is his year column, and
    `annual.consumption` is his `C` column times a constant. An inherited exposure,
    served publicly from lecture-python-advanced.myst since 2026-04-10. No
    permission has been sought from Yale or from Professor Shiller.
    Registered for licence review on QuantEcon/data-lectures#35.

