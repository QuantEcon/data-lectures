# ---------------------------------------------------------------------------
# Shape
# ---------------------------------------------------------------------------
# Measured from the committed bytes 2026-08-17.
#
# This is a BUNDLE, not a table: the top-level JSON object has three keys, each
# holding a pandas `orient='split'` dict {columns, index, data}. The consuming
# lecture rebuilds each with
#   pd.DataFrame(raw[k]["data"], columns=raw[k]["columns"], index=raw[k]["index"])
# so BOTH the column order and the index are load-bearing — a consumer that
# reorders either silently changes what it reads. Note that every index entry is
# a STRING, including the monthly and quarterly date stamps ("1959-03-31
# 00:00:00"): the frames come back with an object index, not a DatetimeIndex.
# The whole file is one line with no trailing newline.
#
# `tables:` is the bundle analogue of the `sheets:` block in dette.xlsx.yml and
# mpd2020.xlsx.yml — same intent (one entry per readable sub-table, each with
# its own shape, columns and nulls), same standing as an undocumented but
# established local extension. No tooling reads it.

schema:
  format: json
  bundle_orient: split          # each top-level value is {columns, index, data}
  table_count: 3
  tables:
    - name: annual
      shape: [95, 4]
      index: >
        positional strings "0"-"94" — a RangeIndex serialised as text, carrying
        no information; the calendar year is the `year` COLUMN
      columns:
        - {name: year, dtype: float64, description: "calendar year, 1891-1985, stored as a float (1891.0). Unpacked by the lecture but never used"}
        - {name: stock, dtype: float64, description: "gross real annual total return on the S&P Composite — Shiller chapt26 `Data` column P plus 1. Observed 0.635-1.514"}
        - {name: bond, dtype: float64, description: "gross real annual one-year interest rate — Shiller chapt26 `Data` column H (`RealR`), reproduced unchanged. Observed 0.853-1.251"}
        - {name: consumption, dtype: float64, description: "real per-capita consumption LEVEL, not a ratio: 0.8938191876245914 x Shiller chapt26 `Data` column C. Observed 2412.2-17039.7; the unit is nominally chained 2005 dollars but the constant factor is unexplained (see integrity.upstream). Only its growth ratio is ever used"}
      known_nulls: {}
      date_range: {start: 1891, end: 1985}
      description: >
        The lecture's headline exhibit. `stock` and `bond` are the two payoffs
        of the annual HJ frontier; `consumption` drives the CRRA IMRS points
        m = 0.95 (c[t+1]/c[t])^g for g = 0,-1,...,-30.
    - name: monthly
      shape: [334, 3]
      index: >
        month-end timestamps as STRINGS, "1959-03-31 00:00:00" to "1986-12-31
        00:00:00" — an unbroken 334-month grid
      columns:
        - {name: stock, dtype: float64, description: "gross real monthly total return on the S&P Composite — the ratio of consecutive months of Shiller ie_data.xls `Real Total Return Price`. Observed 0.879-1.119"}
        - {name: bill, dtype: float64, description: "gross real monthly Treasury-bill return, (1 + TB3MS/100/12) deflated by the realised CPIAUCSL inflation of the SAME month. Observed 0.989-1.011"}
        - {name: cons_ratio, dtype: float64, description: "MISLABELLED — not consumption. The growth rate of (DNDGRG3M086SBEA + DSERRG3M086SBEA)/POPTHM, i.e. a sum of two chain-type PRICE indices per head; economically it is PCE inflation net of population growth. Observed 0.991-1.016. Read by nothing"}
      known_nulls: {}
      date_range: {start: 1959-03-31, end: 1986-12-31}
      description: >
        Base payoffs for the monthly frontier in the time-nonseparable
        section. Only `stock` and `bill` are consumed.
    - name: quarterly
      shape: [270, 4]
      index: >
        month-end timestamps as STRINGS, "1964-07-31 00:00:00" to "1986-12-31
        00:00:00" — MONTHLY stamps on an unbroken 270-month grid. "Quarterly"
        names the three-month HOLDING PERIOD, not the observation frequency:
        the returns overlap, and consecutive rows share two months
      columns:
        - {name: r3, dtype: float64, description: "gross real three-month holding-period return on a 3-month bill (held to maturity), from TB3MS deflated by CPIAUCSL over t..t+3. Observed 0.985-1.029"}
        - {name: r6, dtype: float64, description: "same, 6-month bill sold at t+3 as a 3-month bill (TB6MS -> TB3MS). Observed 0.980-1.035"}
        - {name: r9, dtype: float64, description: "same, 9-month bill sold at t+3 as a 6-month bill. The 9-month yield is OURS — the arithmetic mean of TB6MS and GS1, not a published series. Observed 0.973-1.046"}
        - {name: r12, dtype: float64, description: "same, 12-month bill (GS1) sold at t+3 as a 9-month bill (interpolated as above). Observed 0.964-1.063"}
      known_nulls: {}
      date_range: {start: 1964-07-31, end: 1986-12-31}
      description: >
        The four-asset menu behind the duality figures and the replication of
        the paper's Figure 6. All four columns are consumed. The 1964:7 start
        is NOT forced by data availability (TB6MS begins 1958-12, GS1
        1953-04) and no reason for it is recorded anywhere.
  row_count_floor: null         # per-table, declared above; the file is a
                                # frozen historical extract and does not grow
  date_range: {start: 1891, end: 1986}
  known_nulls: {}               # genuinely none — 2,462 data cells, zero
                                # nulls across all three tables

# ---------------------------------------------------------------------------
# Consumers — how a correction knows what to rebuild
# ---------------------------------------------------------------------------
# Every lecture that CONSUMES this dataset. The list answers "what must be
# rebuilt if these bytes change", so it also names a consumer that still reads a
# local copy rather than this repo — such an entry carries a `note` saying so,
# and is the only machine-readable trace of that divergence. Empty means nothing
# consumes it yet. The one consumer below reads advanced.myst's own raw URL
# today; migration.yml flips to `repointed` when the repoint PR merges (PLAN,
# "Repoint rules").
#
# That consumer is QuantEcon/lecture-python-advanced.myst,
# lectures/hansen_jagannathan_1991.md — one file, one read, established by
# BASENAME grep across all nine lecture clones (the URL is split across three
# adjacent Python string literals at :183-185, so a whole-URL grep returns a
# confident zero). Two other lectures name `hansen_jagannathan_1991`, but only
# as {doc} cross-references: doubts_or_variability.md:200 and
# risk_aversion_or_mistaken_beliefs.md:1673,1838.
#
# A third reference-holder that is NOT a repoint target: the generated mirror
# QuantEcon/lecture-python-advanced.notebooks bakes the same URL into
# hansen_jagannathan_1991.ipynb (HTTP 200, verified 2026-08-17). It self-heals
# after a publish tag while the lecture still exists in the source repo, so it
# is deliberately not listed (wave A4 precedent).
consumers:
  - repo: QuantEcon/lecture-python-advanced.myst
    file: lectures/hansen_jagannathan_1991.md

# ---------------------------------------------------------------------------
# Builder
# ---------------------------------------------------------------------------
# `unrecovered`, but unusually for that state the construction is FULLY
# SPECIFIED rather than lost — recovered by re-derivation on 2026-08-17 and
# recorded here so Phase 9 is a finishing job, not an investigation. The reason
# it is not `committed` is precise: a builder written to this specification
# reproduces the file to within 4 ULP but NOT byte for byte (63,457 B against
# 63,456 B; 2,179 of 2,462 data cells bitwise identical), so committing it
# would name a builder that does not produce the bytes beside it. Two residues
# block byte-exactness — the arithmetic form used for the two Shiller-derived
# stock legs, which agree to <=4 ULP but match bitwise only about half the
# time under every form tried (1+Return, exp(ln(1+ret)), the RealP/RealD
# quotient, and the pandas ratio/pct_change variants), and the unexplained
# 0.8938191876245914 factor on annual.consumption. Everything else is exact.
#
# The recovered specification, verbatim enough to re-implement:
#
#   annual (95 rows, Shiller chapt26.xlsx sheet `Data`, header rows 0-7):
#     year        = column A, 1891..1985, as float
#     stock       = 1 + column P ("Return on S&P Composite")
#     bond        = column H ("RealR")
#     consumption = 0.8938191876245914 * column I ("C")
#     index       = str(i) for a 0-based RangeIndex
#
#   monthly (334 rows, 1959-03..1986-12):
#     stock       = RTRP[t]/RTRP[t-1], RTRP = ie_data.xls sheet `Data`
#                   column J ("Real Total Return Price")
#     bill        = (1 + TB3MS[t]/100/12) / (CPIAUCSL[t]/CPIAUCSL[t-1])
#                   — note the BACKWARD deflator
#     cons_ratio  = x[t]/x[t-1] with
#                   x = (DNDGRG3M086SBEA + DSERRG3M086SBEA)/POPTHM
#     index       = str(month-end Timestamp)
#
#   quarterly (270 rows, 1964-07..1986-12, monthly stamps):
#     y3 = TB3MS, y6 = TB6MS, y12 = GS1, y9 = (TB6MS + GS1)/2
#     P(n,t) = 1 / (1 + (y_n[t]/100) * (n/12))      # simple discount, P(0,.) = 1
#     r_n[t] = [P(n-3, t+3) / P(n, t)] / (CPIAUCSL[t+3]/CPIAUCSL[t])
#                   — note the FORWARD deflator, opposite to `monthly.bill`
#     index       = str(month-end Timestamp)
#
#   serialisation: json.dumps of
#     {name: {"columns": [...], "index": [str(i) ...], "data": df.values.tolist()}}
#   with default separators, one line, no trailing newline.
#
# Anyone completing this should also settle the two open items recorded above
# (the consumption scale factor, and the mislabelled `monthly.cons_ratio`);
# both are data questions for the lecture's author, not infrastructure calls,
# and per AGENTS.md "a migration moves bytes; it does not update them" neither
# is fixed here.
builder: null
builder_status: unrecovered
