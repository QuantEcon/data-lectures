retrieved: 2026-08-03
maintainer: QuantEcon

integrity:
  sha256: 1e03f6d952efc657f64047b6bebab9cd3f79af193e0468b91d525682ce0dbf09
  upstream:
    status: verified
    date: 2026-08-03
    against: WPP2024_DeathsBySingleAgeSex_Medium_1950-2023.csv.gz
    note: >
      Written by re-running the committed builder against the live upstream
      release on the retrieval date, so the file is the builder's output by
      construction. Re-running it reproduces this hash while the 2024 revision
      remains the current WPP vintage.

schema:
  format: csv
  columns:
    - {name: age, dtype: int64, description: single year of age; 100 means "100 and over"}
    - {name: deaths_male, dtype: int64, description: male deaths at this age in 2023}
    - {name: deaths_female, dtype: int64, description: female deaths at this age in 2023}
    - {name: deaths_total, dtype: int64, description: all deaths at this age in 2023}
  row_count_floor: 101
  date_range: {start: 2023, end: 2023}
  known_nulls: {}
  # Counts are published in thousands to three decimals and are scaled to
  # persons and rounded here, so deaths_male + deaths_female may differ from
  # deaths_total by one person at a given age. The builder asserts that bound.

consumers:
