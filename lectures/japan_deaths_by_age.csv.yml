# Manifest for japan_deaths_by_age.csv.

filename: japan_deaths_by_age.csv
title: Japan — deaths by single year of age, 2023
description: >
  The age distribution of deaths in Japan in 2023: counts by single year of age
  from 0 to "100 and over", split by sex. Estimated deaths from the UN World
  Population Prospects 2024 revision, medium variant. Used as an example of a
  strongly left-skewed observed distribution.

# Constructed, not verbatim: the upstream release covers every location and
# every year from 1950 in a single 45 MB gzipped CSV. Selecting Japan in 2023,
# scaling the published thousands to persons, and keeping four columns is our
# processing. The builder is committed -- see `builder` below.
class: constructed

source:
  name: >
    United Nations, Department of Economic and Social Affairs, Population
    Division — World Population Prospects 2024
  series: WPP2024_DeathsBySingleAgeSex_Medium_1950-2023
  url: https://population.un.org/wpp/downloads
  file_url: >
    https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_DeathsBySingleAgeSex_Medium_1950-2023.csv.gz
  version: 2024 revision
  citation: >
    United Nations, Department of Economic and Social Affairs, Population
    Division (2024). World Population Prospects 2024, Online Edition.

