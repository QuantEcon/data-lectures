# Manifest for gdp_population_by_country_2000.csv.

filename: gdp_population_by_country_2000.csv
title: Population, GDP and expenditure shares — seven countries, year 2000
description: >
  A seven-row teaching extract cut from test_pwt.csv: seven countries
  (Argentina, Australia, India, Israel, Malawi, South Africa, United States) in
  the year 2000, with population (POP, thousands), total PPP-converted GDP
  (tcgdp, millions of international dollars), and the consumption and government
  shares of GDP (cc, cg). A running example for a first lecture on tabular data.
  Not citable Penn World Table data; see source.note.

# Constructed: test_pwt.csv with three columns and one row removed. The values
# are copied as text, so they match the parent digit for digit.
class: constructed

source:
  name: test_pwt.csv in this repo, itself a Penn World Table teaching extract of unestablished vintage
  url: https://github.com/QuantEcon/data-lectures/blob/main/lectures/test_pwt.csv
  doi: null
  version: null
  series: country, POP, tcgdp, cc, cg
  citation: >
    Heston, Alan, Robert Summers, and Bettina Aten. Penn World Table (Center
    for International Comparisons of Production, Income and Prices, University
    of Pennsylvania; now maintained by the Groningen Growth and Development
    Centre). Exact version unrecorded, as for test_pwt.csv.
  note: >
    Inherits the provenance gap recorded in test_pwt.csv.yml, whose values match
    none of PWT 7.0, 6.3, 6.2 or 6.1. Removed from the parent: the columns
    `country isocode`, `year` (2000 in every row) and `XRAT`, and the Uruguay row.

license:
  name: null
  url: https://www.rug.nl/ggdc/productivity/pwt/
  redistribution: permitted
  verified: 2026-08-18
  note: >
