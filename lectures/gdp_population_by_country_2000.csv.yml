schema:
  format: csv
  columns:
    - {name: country, dtype: str, description: "country name, 7 unique — Argentina, Australia, India, Israel, Malawi, South Africa, United States"}
    - {name: POP, dtype: float64, description: "population, thousands. Observed 6114.57-1006300.297"}
    - {name: tcgdp, dtype: float64, description: "total PPP-converted GDP, millions of international dollars. Observed 5026.22-9898700"}
    - {name: cc, dtype: float64, description: "consumption share of PPP-converted GDP per capita, percent. Observed 64.44-75.72"}
    - {name: cg, dtype: float64, description: "government share of PPP-converted GDP per capita, percent. Observed 5.58-14.07"}
  row_count_floor: 7            # exact by design: a frozen teaching extract
  date_range: {start: 2000, end: 2000}
  known_nulls: {}

