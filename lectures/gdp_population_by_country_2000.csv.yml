    This file publishes a subset of bytes already served from this repo.

retrieved: 2026-11-06           # the date this subset was cut from test_pwt.csv
maintainer: QuantEcon

integrity:
  sha256: e0ebe12698debd3ada4aa8d134396bc2f48da6d04343be328da95d0df4a900e5
  upstream:
    status: unverifiable
