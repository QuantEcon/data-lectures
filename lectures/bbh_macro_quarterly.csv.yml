# ---------------------------------------------------------------------------
# Shape
# ---------------------------------------------------------------------------
# Measured from the committed bytes 2026-08-17 (pandas 2.3.3), and asserted by
# the builder's validate() stage on every run. All fourteen data columns are
# float64 levels in the units FRED publishes them in; the lecture does every
# transformation itself.

schema:
  format: csv
  columns:
    - {name: YYYYQ, dtype: int64, description: "integer quarter key, year*10 + quarter — 19551 (1955Q1) to 20194 (2019Q4), 260 rows on an unbroken quarterly grid. The CSV index column"}
    - {name: GDP, dtype: float64, description: "FRED GDP — nominal GDP, billions of dollars, SAAR. Observed 413.073-21694.458. Lecture denominator for the consumption and investment rates"}
    - {name: GDPC1, dtype: float64, description: "FRED GDPC1 — real GDP, billions of CHAINED 2012 dollars (not 2017; see source.note), SAAR. Observed 2815.134-19202.31. Lecture: annualized log growth, and the numerator of the output gap"}
    - {name: GDPPOT, dtype: float64, description: "FRED GDPPOT — CBO real potential GDP, billions of chained 2012 dollars. Observed 2757.5375-19225.5991. Lecture: denominator of `output_gap` only"}
    - {name: PCESV, dtype: float64, description: "FRED PCESV — PCE on services, billions of dollars, SAAR. Observed 108.459-10113.165. Lecture: added to PCEND for the consumption rate"}
    - {name: GPDI, dtype: float64, description: "FRED GPDI — gross private domestic investment, billions of dollars, SAAR. Observed 65.065-3858.192. Lecture: the investment rate"}
    - {name: PIRIC, dtype: float64, description: "FRED PIRIC — relative price of investment goods, index based 2012=1 in this vintage (FRED now publishes 2017=1), SA. Observed 0.8418-3.8553. Lecture: 100*log first difference"}
    - {name: PRS85006023, dtype: float64, description: "FRED PRS85006023 — nonfarm business sector average weekly hours, all workers, index based 2012=100 in this vintage (FRED now publishes 2017=100), SA. Observed 97.982-116.693. Lecture: combined with CE16OV/CNP16OV into log hours per capita"}
    - {name: CPIAUCSL, dtype: float64, description: "FRED CPIAUCSL — CPI-U all items, 1982-84=100, SA, quarterly average of the three monthly values. Observed 26.7567-257.7853. Lecture: year-over-year inflation"}
    - {name: PCEND, dtype: float64, description: "FRED PCEND — PCE on nondurable goods, billions of dollars, SAAR, quarterly average of the three monthly values. Observed 126.0667-3001.6, and EMPTY before 1959Q1 — see known_nulls"}
    - {name: UNRATE, dtype: float64, description: "FRED UNRATE — civilian unemployment rate, percent, SA, quarterly average. Observed 3.4-10.6667. Enters the VAR in levels and is the variable the unemployment belief wedge is measured against"}
    - {name: CUMFNS, dtype: float64, description: "FRED CUMFNS — capacity utilization, manufacturing (SIC), percent, SA, quarterly average. Observed 63.7623-91.5667"}
    - {name: FEDFUNDS, dtype: float64, description: "FRED FEDFUNDS — effective federal funds rate, percent, NSA, quarterly average of monthly averages of daily figures. Observed 0.0733-17.78"}
    - {name: CE16OV, dtype: float64, description: "FRED CE16OV — civilian employment level, thousands of persons, SA, quarterly average. Observed 60814.6667-158544.0"}
    - {name: CNP16OV, dtype: float64, description: "FRED CNP16OV — civilian noninstitutional population 16+, thousands of persons, NSA, quarterly average. Observed 109130.3333-260015.3333. Steps DOWN in 2008Q1, 2017Q1 and 2019Q1 on the BLS January population controls, so it is not monotonic"}
  row_count_floor: 260          # exact by design, not a floor with headroom:
                                # the window is fixed at 1955Q1-2019Q4 and does
                                # not grow. validate() asserts equality.
  date_range: {start: 19551, end: 20194}   # in the file's own YYYYQ key, i.e.
                                           # 1955Q1 to 2019Q4 inclusive

  # The only nulls in the file, and they are structural: FRED publishes PCEND
  # from 1959-01, so 1955Q1-1958Q4 is empty in that column and complete in every
  # other. The lecture's `cons_r` is therefore NaN for those 16 quarters, which
  # is harmless — its VAR is estimated from 1960Q1. validate() asserts these
  # exact 16 and no others, so a new hole fails instead of shipping.
  known_nulls: {PCEND: 16}

# ---------------------------------------------------------------------------
# Consumers — how a correction knows what to rebuild
# ---------------------------------------------------------------------------
# One consumer, established by a tree sweep of all 278 QuantEcon repos on
# 2026-08-17 (two returned no default branch: numfocus, quantecon-book-dp).
# lecture-python-advanced.myst has no translation repo, and the generated
# lecture-python-advanced.notebooks mirror holds the lecture's .ipynb but not the
# CSV; it self-heals after a publish tag and is not a repo anyone repoints, so it
# is deliberately not listed (wave A4 precedent).
#
# Note for whoever repoints: the read is SPLIT ACROSS LINES and shares a
# `data_path` variable with bbh_michigan_monthly.csv (lectures/
# subjective_beliefs_business_cycles.md:149-153), so a filename-only grep finds
# it but a whole-path grep does not, and editing one file's line alone leaves the
# other appended to a path that no longer exists in the flat published tree. The
# two C1 files in this lecture repoint together.
consumers:
  - repo: QuantEcon/lecture-python-advanced.myst
    file: lectures/subjective_beliefs_business_cycles.md
    note: >
      Reads its own copy at
      `lectures/_static/lecture_specific/subjective_beliefs_business_cycles/`,
      not this file — the repoint PR in lecture-python-advanced.myst follows
      this one, and migration.yml records the dataset as `landed` until it
      merges. Listed now because a correction to these bytes must reach the
      lecture regardless of where it currently reads them from
      (QuantEcon/data-lectures#91).

