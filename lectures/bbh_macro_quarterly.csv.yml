# Manifest for bbh_macro_quarterly.csv — migrated out of
# QuantEcon/lecture-python-advanced.myst, where it sat at
# lectures/_static/lecture_specific/subjective_beliefs_business_cycles/ and was
# read by relative path (PLAN Phase 8, wave C1).
#
# "BBH" is Bhandari, Borovička and Ho. These bytes are NOT FRED as FRED
# publishes it today: they are the authors' 2022-vintage FRED snapshot, archived
# inside their replication package, subset to fourteen series and 1955Q1-2019Q4
# and averaged to quarterly. The builder must read the immutable Zenodo record
# and must NOT read live FRED — but note carefully WHY, because the obvious
# reason is wrong. These columns are on a 2012 base and FRED has since rebased
# to 2017, yet the lecture takes log first differences and ratios, which are
# rebasing-invariant: under a pure rebasing 8 of the 9 VAR inputs are bit-identical
# and `output_gap` is invariant to 2.3e-14. The operative risk is upstream
# REVISIONS to the national accounts, not the rebasing.
#
# The builder below is a RECONSTRUCTION, not a recovered original: no build
# script for this file has ever existed in the lecture repo. It was written from
# the committed bytes plus the replication package, and it reproduces the
# committed file byte for byte (sha256 below; three end-to-end runs, 2026-08-17). It therefore
# takes `committed`, not `unrecovered`. This supersedes the previous entry in
# scripts/audit_annotations.yml, which said "extraction not scripted"
# (provenance: constructed-lost) — right when it was written, wrong now; delete
# that entry in the same PR that lands this manifest.

filename: bbh_macro_quarterly.csv
title: Bhandari-Borovička-Ho replication — quarterly US macro series for the belief-wedge VAR, 1955Q1-2019Q4
description: >
  Fourteen quarterly US macro series, 1955Q1-2019Q4, indexed by an integer
  YYYYQ key (19551 = 1955Q1). Thirteen of them are the inputs to the nine-variable VAR(2)
  that the `subjective_beliefs_business_cycles` lecture uses as the
  data-generating benchmark forecast against which household survey
  expectations are differenced. Extracted from the FRED snapshot archived in
  Bhandari, Borovička and Ho's replication package; column names are the FRED
  series IDs. Levels only — every transformation (year-over-year inflation, log
  growth rates, ratios to GDP) is done in the lecture.

# Constructed: fourteen of the thirty series in the source workbook (17 monthly in
# FRED_M, 13 quarterly in FRED_Q), taken
# from its two sheets, with the monthly block averaged to quarterly, the window
# cut to 1955Q1-2019Q4 and values rounded to four decimals. Nothing here is
# republished as distributed, so it is not verbatim.
class: constructed

source:
  name: >
    Replication package for "Survey data and subjective beliefs in business
    cycle models" (Bhandari, Borovička and Ho), file
    `data input/FRED/data_FRED.xlsx`
  url: https://doi.org/10.5281/zenodo.10194324
  doi: 10.5281/zenodo.10194324     # versioned record; concept DOI is
                                   # 10.5281/zenodo.10194323
  version: >
    Zenodo record 10194324, published 2023-11-22; Zenodo declares no
    version string (`metadata.version` is null) and the record has exactly one
    version (`/versions` returns 1 hit), one 198,817,944-byte
    member `replication package.zip` (md5 6e33f9b9e70135cbf3304275d1c5d604).
    The workbook this builder extracts is 169,348 B, sha256 f2d330ea…65ba5d,
    zip-entry mtime 2023-11-20 23:18 — recorded as an artifact fact, NOT as a
    retrieval date. Its FRED_M/FRED_Q sheets run 1945M1-2022M12 / 1945Q1-2022Q4
    because the package's `load_replication_parameters.m` sets
    `M_macro_end = 202212; Q_macro_end = 20224`, not because FRED stopped there.
    The identical values also appear in the package's
    `data output/data_processed.xlsx` (sheets macro_M / macro_Q), verified max
    abs diff 0.0 on all fourteen columns, so either workbook is a valid input;
    the builder reads the `data input` one because it is the raw snapshot.
  series: >
    FRED IDs, quarterly at source — GDP (Gross Domestic Product, $bn SAAR, BEA);
    GDPC1 (Real GDP, $bn chained, SAAR, BEA); GDPPOT (Real Potential GDP, $bn
    chained, CBO); PCESV (PCE: Services, $bn SAAR, BEA); GPDI (Gross Private
    Domestic Investment, $bn SAAR, BEA); PIRIC (Relative Price of Investment
    Goods, index, SA — contributed to FRED by Riccardo DiCecio, not a federal
    statistical release); PRS85006023 (Nonfarm Business Sector: Average Weekly
    Hours for All Workers, index, SA, BLS).
    FRED IDs, monthly at source and averaged over each quarter's three months —
    CPIAUCSL (CPI-U All Items, 1982-84=100, SA, BLS); PCEND (PCE: Nondurable
    Goods, $bn SAAR, BEA); UNRATE (Unemployment Rate, %, SA, BLS); CUMFNS
    (Capacity Utilization: Manufacturing (SIC), %, SA, Federal Reserve Board
    G.17); FEDFUNDS (Federal Funds Effective Rate, %, NSA, Federal Reserve Board
    H.15); CE16OV (Employment Level, thousands, SA, BLS); CNP16OV (Population
    Level, thousands, NSA, BLS).
  citation: >
    Bhandari, Anmol, Jaroslav Borovička, and Paul Ho. 2023. "Replication package
    for: Survey data and subjective beliefs in business cycle models." Zenodo.
    doi:10.5281/zenodo.10194324. Underlying series retrieved by the authors from
    FRED (Federal Reserve Bank of St. Louis). Accompanies Bhandari, Anmol,
    Jaroslav Borovička, and Paul Ho. 2025. "Survey Data and Subjective Beliefs in
    Business Cycle Models." Review of Economic Studies 92 (3): 1375-1437.
    doi:10.1093/restud/rdae054 (Crossref records first online 2024-05-27; the
    lecture cites this as `bhandari2025survey`).
  note: >
    A FRED SNAPSHOT, NOT LIVE FRED, and the distinction is load-bearing. The
    package pulled these series when its authors ran `read_data_FRED.m` (and
    ships with `import_FRED = 0` so a replicator reads the archived copy rather
    than re-pulling). The real-quantity columns are in chained 2012 dollars —
    GDP/GDPC1 = 1.0000 across 2012 in these bytes — and PIRIC and PRS85006023
    are based at 2012 (2012 annual means 1.00005 and 99.99975). FRED has since rebased
    all three to 2017 and revised the national accounts repeatedly. CPIAUCSL is
    unaffected (1982-84=100 in both; the 1982-84 mean here is 100.017).
    Consequently the builder must read the immutable Zenodo record and must not
    read FRED; a live re-fetch is a different dataset, not a refresh.

license:
  name: CC-BY-4.0
  url: https://doi.org/10.5281/zenodo.10194324
  redistribution: permitted
  verified: 2026-08-17
  note: >
    Stated by the Zenodo record itself (`metadata.license.id = cc-by-4.0`, read
    from the Zenodo API 2026-08-17), and repeated in the consuming lecture's
    prose. Attribution is carried by `source.citation` above, which is the whole
    of the CC-BY obligation for a cache like this one. The underlying layer is
    consistent: thirteen of the fourteen series are US federal statistics (BEA,
    BLS, CBO, Federal Reserve Board) delivered through FRED and are US
    Government works; the fourteenth, PIRIC, is a series contributed to FRED by
    Riccardo DiCecio; the FRED page states only "Source: DiCecio, Riccardo",
    names no affiliation, tags the series "public domain: citation requested",
    and defines it as INVDEF/CONSDEF. None of the fourteen
    FRED series pages carries a copyright or no-redistribution block — checked
    2026-08-17 against a positive control (FRED's SP500 page, which does carry
    S&P Dow Jones Indices' "Reproduction … is prohibited" notice), so the zero is
    a real zero and not a broken check. Nothing to register on
    QuantEcon/data-lectures#35.

