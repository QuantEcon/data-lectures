  sha256: 9878434620e2f295a1e00662197f97ecf87681361a3628802d11697f80aaa4f4
  upstream:
    status: verified
    date: 2026-08-03
    against: AmesHousing.xls
    note: >
      Written by re-running the committed builder against the workbook on the
      journal's server on the retrieval date, so the file is the builder's
      output by construction. The upstream workbook is a fixed 2011 release,
      so re-running the builder should reproduce this hash indefinitely.

schema:
  format: csv
  columns:
    - {name: price, dtype: int64, description: sale price in US dollars}
    - {name: bedrooms, dtype: int64, description: bedrooms above grade}
    - {name: living_area_sqft, dtype: int64, description: above-grade living area in square feet}
    - {name: year_built, dtype: int64, description: year of original construction}
    - {name: neighborhood, dtype: object, description: neighborhood within Ames city limits}
  row_count_floor: 2930
  date_range: {start: 2006, end: 2010}
  known_nulls: {}

