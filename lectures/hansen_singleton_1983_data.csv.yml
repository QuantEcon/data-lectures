# Manifest for hansen_singleton_1983_data.csv — migrated out of
# QuantEcon/lecture-python.myst, where it sat at
# lectures/_static/lecture_specific/hansen_singleton_1983/ and was read by URL
# (PLAN Phase 8, wave B2').
#
# READ THE `source` NOTE FIRST. These are NOT Hansen and Singleton's data. The
# paper is the specification being replicated; the bytes are a modern
# reconstruction from open sources, and the return leg is a deliberate
# substitute for the CRSP series the authors used. A reader who takes this file
# for the paper's dataset will misread every number in it.
#
# This file is a STRICT SUPERSET of hansen_singleton_1982_data.csv: identical
# index, and its `gross_real_return` and `gross_cons_growth` columns are bitwise
# identical to that file's two (verified 2026-08-13, max abs diff 0.0). They are
# kept as two files because they serve two lectures, which is the status quo
# this migration preserves; consolidating them is a rename-class decision and is
# deferred with the rest (D6).

filename: hansen_singleton_1983_data.csv
title: Hansen-Singleton (1983) replication — monthly US returns, consumption and inflation, 1959-1978
description: >
  The five monthly series the `hansen_singleton_1983` lecture estimates on,
  over the 1959:2-1978:12 sample: gross real return on the aggregate stock
  market, gross growth of real per-capita nondurable consumption, gross
  consumption-deflator inflation, the per-capita real consumption level itself,
  and the gross real return on one-month Treasury bills. Four of the five are
  gross ratios near 1, not percentages. Reconstructed from FRED and the Ken
  French data library rather than taken from the paper — see the source note.

# Constructed: every value is computed from upstream series by
# builders/hansen_singleton_1983_data.py. Nothing here is republished as
# distributed.
class: constructed

source:
  name: FRED (BEA and BLS monthly series) and the Ken French data library (F-F_Research_Data_Factors)
  # The Ken French library is the single downloadable FILE the builder
  # retrieves; the three FRED inputs are separate series, enumerated below.
  url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
  doi: null                     # neither provider issues one for these series
  version: >
    Ken French research factors, zip header "This file was created using the
    202606 CRSP database. The 1-month TBill rate data until 202405 are from
    Ibbotson Associates" — read 2026-08-13. That Ibbotson clause covers the
    whole of this file's sample, since it ends in 1978. FRED series are
    unversioned and revisable; the 1959-1978 window used here has been stable
    across every check so far (see integrity.upstream).
  series: >
    FRED CNP16OV (civilian noninstitutional population 16+, thousands of
    persons, BLS Employment Situation);
    FRED DNDGRA3M086SBEA (real PCE, nondurable goods, chain-type quantity
    index, 2017=100, SA, BEA Personal Income and Outlays);
    FRED DNDGRG3M086SBEA (PCE, nondurable goods, chain-type price index,
    2017=100, SA, BEA);
    Ken French F-F_Research_Data_Factors, monthly `Mkt-RF` and `RF`.
  citation: >
    Constructed by QuantEcon from U.S. Bureau of Economic Analysis and U.S.
    Bureau of Labor Statistics series retrieved via FRED (Federal Reserve Bank
    of St. Louis), and from the Fama-French research factors published by
    Kenneth R. French, Tuck School of Business, Dartmouth College. Replicates
    the data construction of Hansen, Lars Peter, and Kenneth J. Singleton.
    1983. "Stochastic Consumption, Risk Aversion, and the Temporal Behavior of
    Asset Returns." Journal of Political Economy 91 (2): 249-265.
    doi:10.1086/261141.
  note: >
    NOT the authors' data, and not a faithful copy of it. Hansen and Singleton
    used CRSP value-weighted NYSE returns paired with NIPA nondurables
    consumption. CRSP is a paid subscription product, so the market leg here
    substitutes the Ken French value-weighted research factor (`Mkt-RF + RF`)
    and the T-bill leg its `RF` column — close to but not the same series, which
    is why the lecture states plainly that it matches the paper qualitatively
    and not exactly. The consumption leg uses FRED's modern BEA chain-type
    indices, not the 1970s NIPA vintage the authors had. The paper is the
    specification being replicated; the bytes are ours.

license:
  name: null
  url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
  # Recorded as found, per the record-and-track policy (AGENTS.md, "Licensing
  # and attribution"). Split answer across the two providers, and only one half
  # has a licence to name.
  redistribution: permitted
  verified: 2026-08-13
  note: >
    The three FRED inputs are U.S. federal statistics — BEA chain-type indices
    and the BLS civilian noninstitutional population — which are U.S.
    Government works in the public domain; FRED is the delivery channel, not the
    rights holder, and these are not among the third-party series FRED re-serves
    under restriction. The Ken French data library states NO licence and NO
    redistribution terms: the page carries only "Copyright (c) Eugene F. Fama
    and Kenneth R. French" (checked 2026-08-13), and the factors are themselves
    computed from the proprietary CRSP database with the pre-2024 T-bill leg
    from Ibbotson Associates — which is the whole of this file's sample.
    `permitted` therefore rests on what is actually published here rather than
    on a grant: not the library file, but two of its columns converted to gross
    ratios and deflated by a FRED price index over a fixed 1959-1978 window —
    from which the underlying factor values cannot be recovered without the
    deflator. Note this file does publish `gross_inflation_cons`, so its two
    real return columns ARE invertible back to the nominal `Mkt-RF + RF` and
    `RF` for those 239 months; that is the strongest form of the exposure here
    and the reason it is written down rather than waved through. An inherited
    exposure, served publicly from lecture-python.myst since 2026-06-26. No
    permission has been sought from either provider. Registered for licence
    review on QuantEcon/data-lectures#35.

retrieved: null                 # the builder fetches live and no retrieval date
                                # was recorded upstream; not reconstructed from
                                # git history (AGENTS.md). It costs nothing
                                # here — a re-run on 2026-08-13 reproduced these
                                # bytes exactly, so the vintage is pinned by
                                # content rather than by a date. For context and
                                # NOT as a retrieval date: the bytes and their
                                # builder landed in lecture-python.myst together
                                # in a3e8443 (#926), 2026-06-26.
maintainer: QuantEcon

