# ---------------------------------------------------------------------------
# Shape
# ---------------------------------------------------------------------------
# Measured from the committed bytes 2026-08-13, and asserted by the builder's
# validate() stage on every run.

schema:
  format: csv
  columns:
    - {name: date, dtype: datetime64, description: "month-end stamp, 1959-02-28 to 1978-12-31 on an unbroken monthly grid — the CSV index column"}
    - {name: gross_real_return, dtype: float64, description: "gross real monthly return on the aggregate stock market: (1 + (Mkt-RF + RF)/100) divided by gross_inflation_cons. A ratio near 1 (observed 0.865-1.159), not a percentage and not a net return"}
    - {name: gross_cons_growth, dtype: float64, description: "gross monthly growth of real per-capita nondurable consumption — the ratio of consecutive months of consumption_per_capita. Observed 0.967-1.033"}
    - {name: gross_inflation_cons, dtype: float64, description: "gross month-over-month inflation of the PCE nondurables price deflator (DNDGRG3M086SBEA); the deflator applied to both nominal return legs. Observed 0.995-1.024"}
    - {name: consumption_per_capita, dtype: float64, description: "real per-capita nondurable consumption, DNDGRA3M086SBEA / CNP16OV. A LEVEL, and the one column with no interpretable unit: it divides a chain-type index (2017=100) by a population in thousands, so it lands near 2.4e-4 and is meaningful only through its growth rate. Observed 2.14e-4 to 2.66e-4"}
    - {name: gross_real_tbill, dtype: float64, description: "gross real monthly return on one-month Treasury bills: (1 + RF/100) divided by gross_inflation_cons. Observed 0.984-1.008. Exceeded by gross_real_return in only 54% of months, though the mean excess is positive"}
  row_count_floor: 239          # exact by design, not a floor with headroom:
                                # the sample is the paper's 1959:2-1978:12 and
                                # does not grow. validate() asserts equality.
  date_range: {start: 1959-02-28, end: 1978-12-31}
  known_nulls: {}               # genuinely none — a complete monthly panel

# ---------------------------------------------------------------------------
# Consumers — how a correction knows what to rebuild
# ---------------------------------------------------------------------------
# Both repointed 2026-08-13. lecture-python.zh-cn is outside the audit's
# SCAN_REPOS, so it is recorded here or nowhere. The generated
# lecture-python.notebooks mirror is a third reference-holder; it self-heals
# after a publish tag and is not a repo anyone repoints, so it is deliberately
# not listed (wave A4 precedent).
#
# Both reads previously built the URL by string concatenation across three
# source lines, and both were COLLAPSED at the repoint rather than patched:
# editing the stem line alone would have left the filename appended to a path
# that no longer exists, since the flat published tree has no
# _static/lecture_specific/<lecture>/ segment.
# Note for any future sweep: a line-based grep for the whole old URL returns a
# confident ZERO against the wrapped form. Grep the filename separately.
#
# Each lecture ALSO carried two references to the BUILDER — a prose link, and
# the path named again in a docstring inside the data cell. Neither is a code
# read, so neither would have failed a build; both moved with it.
#
# A correction to this file must be mirrored into hansen_singleton_1982_data.csv
# whenever it touches gross_real_return or gross_cons_growth: those two columns
# are that file, bitwise.
consumers:
  - repo: QuantEcon/lecture-python.myst
    file: lectures/hansen_singleton_1983.md
  - repo: QuantEcon/lecture-python.zh-cn
    file: lectures/hansen_singleton_1983.md

builder: builders/hansen_singleton_1983_data.py
builder_status: committed
