# confident ZERO against the wrapped form. Grep the filename separately.
#
# Each lecture ALSO carries two references to the BUILDER — a prose link, and
# the path named again in a docstring inside the data cell. Neither is a code
# read; both break silently when the builder moves here.
consumers: []

