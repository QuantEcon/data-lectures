# ---------------------------------------------------------------------------
# Shape
# ---------------------------------------------------------------------------
# Measured from the committed bytes 2026-08-13, and asserted by the builder's
# validate() stage on every run.

schema:
  format: csv
  columns:
    - {name: date, dtype: datetime64, description: "month-end stamp, 1959-02-28 to 1978-12-31 on an unbroken monthly grid — the CSV index column"}
    - {name: gross_real_return, dtype: float64, description: "gross real monthly return on the aggregate stock market: (1 + (Mkt-RF + RF)/100) divided by the gross monthly inflation of the PCE nondurables price deflator. A ratio near 1 (observed 0.865-1.159), not a percentage and not a net return"}
    - {name: gross_cons_growth, dtype: float64, description: "gross monthly growth of real per-capita nondurable consumption — the ratio of consecutive months of (DNDGRA3M086SBEA / CNP16OV). Observed 0.967-1.033"}
  row_count_floor: 239          # exact by design, not a floor with headroom:
                                # the sample is the paper's 1959:2-1978:12 and
                                # does not grow. validate() asserts equality.
  date_range: {start: 1959-02-28, end: 1978-12-31}
  known_nulls: {}               # genuinely none — a complete monthly panel

# The gross monthly inflation of the nondurables deflator is used to deflate the
# nominal return but is NOT a column here. hansen_singleton_1983_data.csv
# carries it, along with the per-capita consumption level and the T-bill leg.

