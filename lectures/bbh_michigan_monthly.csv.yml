# ---------------------------------------------------------------------------
# Shape
# ---------------------------------------------------------------------------
# Measured from the committed bytes 2026-08-17 with pandas 2.3.3, and asserted
# by the builder's validate() stage on every run.

schema:
  format: csv
  columns:
    - {name: yyyymm, dtype: int64, description: "month stamp as the integer YYYYMM, 197801 to 202003 on an unbroken monthly grid — the CSV index column"}
    - {name: px1_mean, dtype: float64, description: "mean expected change in prices over the next 12 months, percent per year, all households (Michigan table 32 / PX1). Observed 1.0-13.8. This is the MEAN; FRED's MICH series is the median and is a different series"}
    - {name: share_more, dtype: int64, description: "percent of households expecting MORE unemployment over the next year, all households (Michigan table 30 / UMEX). Whole percents, observed 13-72"}
    - {name: share_same, dtype: int64, description: "percent expecting ABOUT THE SAME unemployment. Whole percents, observed 20-67"}
    - {name: share_less, dtype: int64, description: "percent expecting LESS unemployment. Whole percents, observed 3-42"}
    - {name: unrate, dtype: float64, description: "US civilian unemployment rate, percent, seasonally adjusted, monthly (FRED UNRATE / BLS). Observed 3.5-10.8"}
  row_count_floor: 507          # exact by design, not a floor with headroom: the
                                # window is frozen at 1978-01..2020-03 and does
                                # not grow. validate() asserts equality.
  date_range: {start: 197801, end: 202003}   # in the file's own YYYYMM integers
  known_nulls: {}               # genuinely none — 507 complete rows, 0 nulls in
                                # every column
  # The three shares are the answer distribution NET of "don't know", so they sum
  # to at most 100 and not to exactly 100: observed totals run 94-100, equal to
  # 100 on only 99 of 507 months. The lecture depends on this — it renormalises
  # by their sum before applying Carlson-Parkin — so it is a property of the data,
  # not a defect. The deposit's umex_dk_all column carries the residual and is
  # not published here.

# ---------------------------------------------------------------------------
# Consumers — how a correction knows what to rebuild
# ---------------------------------------------------------------------------
# One consuming repo, one lecture file, established by an authenticated Trees-API
# sweep of all 278 QuantEcon repos on 2026-08-17 (276 scanned, 2 empty, 0 errors)
# plus a content grep of every local clone. `gh repo list` shows no translation
# of lecture-python-advanced.myst.
#
# The read is a RELATIVE PATH, not a URL — `data_path + 'bbh_michigan_monthly.csv'`
# joined at subjective_beliefs_business_cycles.md:152 (`data_path` is assigned
# at md:149; the call wraps onto md:153). The full path string never appears in
# the source, so a literal-path grep returns a confident ZERO — sweep by basename.
# It must be COLLAPSED at the repoint, not patched on the stem line: the flat
# published tree has no _static/lecture_specific/<lecture>/ segment, so editing
# the filename alone would leave it appended to a path that no longer exists.
# The same lecture reads bbh_macro_quarterly.csv from the same `data_path` two
# lines earlier; both go together. A line-based grep for the whole read returns a
# confident ZERO against the wrapped form — sweep by basename.
#
# There are no {download} roles and no prose references to this filename anywhere
# in lecture-python-advanced.myst; md:152 is the only reference in the repo.
#
# QuantEcon/lecture-python-advanced.notebooks/subjective_beliefs_business_cycles.ipynb
# carries the same two-line read. It is a generated mirror that self-heals after a
# publish tag and is not a repo anyone repoints, so it is deliberately not listed
# (wave A4 precedent) — but note the caveat recorded on workspace-lectures#45:
# a mirror entry orphaned by a lecture's removal never self-heals.
consumers:
  - repo: QuantEcon/lecture-python-advanced.myst
    file: lectures/subjective_beliefs_business_cycles.md
    note: >
      Reads its own copy at
      `lectures/_static/lecture_specific/subjective_beliefs_business_cycles/`,
      not this file — the repoint PR in lecture-python-advanced.myst follows
      this one, and migration.yml records the dataset as `landed` until it
      merges. Listed now because a correction to these bytes must reach the
      lecture regardless of where it currently reads them from
      (QuantEcon/data-lectures#91).

builder: builders/bbh_michigan_monthly.py
builder_status: committed
