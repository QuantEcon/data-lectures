# Manifest for SCF_plus_mini_no_weights.csv — folded in from
# QuantEcon/high_dim_data (PLAN Phase 8, P3). The weight-expanded twin of
# SCF_plus_mini.csv, built by the same frozen builder.
#
# PROVENANCE NOTE: same as its twin — the SCF+ deposit record could not be
# located, so licence and retrieval are honest nulls, registered on
# QuantEcon/data-lectures#35.

filename: SCF_plus_mini_no_weights.csv
title: SCF+ mini, weight-expanded — net wealth and income, 1950-2016
description: >
  SCF_plus_mini.csv with the survey weights applied by repetition instead of
  carried as a column: each household-year is repeated round(weight) times and
  the weights column dropped, so an unweighted statistic over these rows is
  already population-representative. 1,672,214 rows against the weighted file's
  509,455. The maximum-likelihood lecture reads it, filters to 2016 and
  net wealth above 1, and samples from the result.

class: constructed

source:
  name: SCF+ (Kuhn, Schularick and Steins) — an extension of the Survey of Consumer Finances
  url: https://www.journals.uchicago.edu/doi/10.1086/708815
  doi: 10.1086/708815
  citation: >
    Kuhn, Moritz, Moritz Schularick and Ulrike I. Steins (2020). Income and
    Wealth Inequality in America, 1949-2016. Journal of Political Economy,
    128(9), 3469-3519.
  note: >
    Derived from SCF_plus_mini.csv in the same builder run, so its provenance
    chain is that file's. Underlying survey: the Federal Reserve Board's Survey
    of Consumer Finances.

license:
  name: null
  url: null
  redistribution: permitted
  verified: 2026-08-10
  note: >
    Replication data for a published article, served publicly from
    lecture-python-intro and lecture-wasm for years, cached here with
    attribution under the record-and-track policy. No licence statement was
    locatable at any deposit — registered on QuantEcon/data-lectures#35.

retrieved: null                 # inherited from high_dim_data with no recorded
                                # retrieval date
maintainer: QuantEcon

