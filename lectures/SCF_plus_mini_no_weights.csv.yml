# LFS object — the pointer's oid IS the sha256 below, so a 72 MiB file was
# compared exactly without downloading it twice.

integrity:
  sha256: c3b2c78afa4b6cf87fb885947681fd8e54bbe6ee736fce0aaafccdc75788a0a6
  upstream:
    status: unverifiable
    date: 2026-08-10
    against: null
    note: >
      Same unlocatable SCF+ deposit as its twin — Crossref registers no data
