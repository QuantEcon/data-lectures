# ---------------------------------------------------------------------------
# Shape
# ---------------------------------------------------------------------------

schema:
  format: csv
  columns:
    - {name: year, dtype: int64, description: "3-year survey window (upstream `yearmerge`), 20 distinct values"}
    - {name: n_wealth, dtype: float64, description: "net wealth in 2016 USD — may be negative"}
    - {name: t_income, dtype: float64, description: "total household income excluding capital gains, 2016 USD — may be negative"}
    - {name: l_income, dtype: float64, description: "labour income: wages, salaries and self-employment, 2016 USD"}
    - {name: nw_groups, dtype: str, description: "net-wealth group: 0-50%, 50-90% or Top 10%"}
    - {name: ti_groups, dtype: str, description: "total-income group: 0-50%, 50-90% or Top 10%"}
  row_count_floor: 1672214      # frozen extract — exact row count by design
  date_range: {start: 1950, end: 2016}
  known_nulls: {}               # none — the builder drops them before writing

  # A property of the expansion worth knowing before using this file for tail
  # work: rounding the weight to zero drops the household entirely, so 45,709
  # of the weighted file's rows are absent here — and because the wealthiest
  # households carry the smallest survey weights, that truncates the top of the
  # distribution. Maximum n_wealth falls from 2,928,346,000 in
  # SCF_plus_mini.csv to 48,765,100 here. Measured 2026-08-10, not inferred.
  # Use the weighted file for anything sensitive to the extreme upper tail.

consumers:
  # All four repointed 2026-08-11. zh-cn and the canary are outside the
  # audit's SCAN_REPOS, so they are recorded here or nowhere.
  - repo: QuantEcon/lecture-python-intro
    file: lectures/mle.md
  - repo: QuantEcon/lecture-wasm
    file: lectures/mle.md
  - repo: QuantEcon/lecture-intro.zh-cn
    file: lectures/mle.md
  - repo: QuantEcon/test-actions-lecture-intro
    file: lectures/mle.md

