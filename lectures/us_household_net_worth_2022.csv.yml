  name: US Government work — public domain
  url: https://www.federalreserve.gov/disclaimer.htm
  redistribution: permitted
  verified: 2026-09-29
  note: >
    The Board's website policy (Disclaimer, "Copyright/trademark") states:
    "Unless otherwise indicated, information on Board's website is in the
    public domain and may be copied and distributed without permission.
    Please cite to the Board as the source of the information." The SCF pages
