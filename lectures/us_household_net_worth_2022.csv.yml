schema:
  format: csv
  columns:
    - {name: yy1, dtype: int64, description: household id (repeated across its five implicates)}
    - {name: y1, dtype: int64, description: "household-implicate id: 10 * yy1 + implicate number (1-5); unique"}
    - {name: wgt, dtype: float64, description: "survey weight, already divided by 5: summed over all rows it gives the number of US households"}
    - {name: networth, dtype: float64, description: "net worth in 2022 dollars (SCF definition: total assets minus total debt); can be negative"}
  row_count_floor: 22975
  date_range: {start: 2022, end: 2022}
  known_nulls: {}
  # Exactly 22,975 rows by design (4,595 households x 5 implicates), sorted by
  # y1. The builder asserts the count, five implicates per household, y1 =
  # 10 * yy1 + implicate, positive weights and a weight total in the range
  # of the US household count.

