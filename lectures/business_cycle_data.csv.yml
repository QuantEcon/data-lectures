# Manifest for business_cycle_data.csv — the repo's one DYNAMIC SNAPSHOT, and
# the prototype for the P4 pilot (PLAN Phase 8: a maintained snapshot twin for
# lectures that fetch live API data). The file has sat here since the Feb 2025
# migration (QuantEcon/data b857c5c, then the 2026-07-16 flatten in #10)
# without a manifest; this one closes the Phase 6 backfill.
#
# Read this before refreshing: the World Bank REVISES this series. A re-run of
# the builder is not expected to reproduce these bytes and validate() does not
# ask it to — see integrity.upstream. A refresh is a deliberate in-place
# update of a tracking snapshot, reviewed through the builder's overlap-window
# summary (PLAN Phase 5, refresh-as-PR), not a correction and not a new
# vintage under a new name.

filename: business_cycle_data.csv
title: World Bank GDP growth (annual %) — nine economies, 1960 onward
description: >
  Annual real GDP growth (percent, constant local currency) for the nine
  economies the intro `business_cycle` lecture plots — USA, ARG, GBR, GRC, JPN
  in its opening section and CHN, USA, DEU, BRA, ARG, GBR, JPN, MEX in its
  developed/developing comparison — extracted from World Bank WDI series
  NY.GDP.MKTP.KD.ZG in the wide layout wbgapi emits: one row per economy
  (ISO3 code as the index, country name as `Country`), one `YR<year>` column
  per year from 1960 to the newest year the source carries
  (`schema.date_range.end`). The snapshot twin of the lecture's live
  `wb.data.DataFrame` calls; a consumer selects its economies with `.loc`.

# Constructed, tracking a moving source: the World Bank republishes and revises
# this series continuously, and the file is meant to be refreshed in place on
# the cadence below rather than frozen.
class: dynamic-snapshot

source:
  name: World Bank, World Development Indicators (national accounts data, and OECD National Accounts data files)
  series: NY.GDP.MKTP.KD.ZG
  url: https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG
  doi: null
  version: >
    Unknown for the committed bytes — WDI carries a database-level
    `lastupdated` stamp but the export recorded none (see `retrieved`). The
    live database at the 2026-09-01 check reported lastupdated 2026-07-13 and
    had moved on from these bytes (see integrity.upstream).
  citation: >
    World Bank, World Development Indicators, series NY.GDP.MKTP.KD.ZG (GDP
    growth, annual %), from World Bank national accounts data and OECD
    National Accounts data files. Retrieved via wbgapi.
  note: >
    The economy set and the wide `YR<year>` layout are the lecture's choices,
    not the source's — the builder passes the union of the lecture's two
    selections to `wb.data.DataFrame('NY.GDP.MKTP.KD.ZG', [...], labels=True)`.
    Grew from five economies to nine on 2026-09-01, while the file had no
    consumer, so that the lecture's second selection is covered too. Row
    order is whatever wbgapi returns and is kept as returned so a refresh
    diff is values-only.

license:
  name: CC BY-4.0
  url: https://datacatalog.worldbank.org/public-licenses#cc-by
  redistribution: permitted
  verified: 2026-09-01
  note: >
    Stated by the source itself in the series metadata (`License_Type:
    CC BY-4.0`, `License_URL` as above), which the builder dumps to
    provenance/business_cycle_metadata.md on every run; re-read from the live
    metadata on the verification date. World Bank open data under CC BY-4.0
    is the model case for this repo's cache-with-attribution policy
    (AGENTS.md, "Licensing and attribution").

# `retrieved` is stamped by scripts/snapshots.py on every merged refresh; null
# until the first one. The inherited bytes were produced by the committed
# builder in QuantEcon/data commit b857c5c of 2025-02-16 — but that is when
# QuantEcon ran the script and committed the output, and AGENTS.md says not to
# reconstruct a retrieval date from git history. The vintage is pinned by
# content instead: YR2023 is the last column and is populated for all five
# economies, which places the export after the WDI release that first carried
# 2023 growth, and integrity.upstream records how far the live series has
# moved since.
retrieved: 2026-09-01
maintainer: QuantEcon

# ---------------------------------------------------------------------------
# Integrity (PLAN Phase 7)
# ---------------------------------------------------------------------------
# No migration check applies: no lecture has ever read this file (it was
# "never adopted" — PLAN "The audit (2026-07-15)"), so there is no prior copy
# to byte-match and no figure a change here could alter today.

integrity:
  sha256: 41df23233ea238e4166c5c21cc383791015d4c9af6868b840901a8ce083c9da8
  upstream:
    # `diverged`, not `failing`: the builder was re-run in full against live
    # WDI and its output differs from these bytes in the way a revised
    # aggregate is expected to. For a dynamic snapshot this is the normal
    # state between refreshes, not a defect — the refresh is the resolution,
    # and it is a deliberate PR, not something this manifest asks for.
    # status / date / against / note are stamped by scripts/snapshots.py on
    # every merged refresh (the delta block below is dropped at the same time,
    # since a fresh snapshot is `verified` by construction).
    status: verified
    date: 2026-09-01
    against: builders/business_cycle.py
    note: "Refreshed 2026-09-01 by the scheduled refresh: these bytes are the builder's validated output from the live source that day, so they are verified by construction. Overlap window YR1960..YR2025: 0 of 325 cells revised, max |change| 0.0."

# ---------------------------------------------------------------------------
# Shape
# ---------------------------------------------------------------------------
# Measured from the committed bytes 2026-09-01 (pandas 2.3.3) and asserted by
# validate() on every builder run. This is the first manifest to use a
# `pattern` column entry (manifest-schema.yml; QuantEcon/data-lectures#14): the
# year columns are one column per year and their count grows on every refresh,
# so enumerating them would hard-code an end year into a file whose purpose is
# to move.

schema:
  format: csv
  columns:
    - {name: economy, dtype: str, description: "ISO3 code — wbgapi's index, written as the CSV's first column; the lecture reads it with index_col=0"}
    - {name: Country, dtype: str, description: "country name, the label column wbgapi adds with labels=True"}
    - {pattern: 'YR\d{4}', dtype: float64, description: "annual real GDP growth, percent, one column per year on an unbroken grid from YR1960 to the newest year the source carries (`schema.date_range.end`). The builder's validate() bounds every value at ±50 and requires at least one |value| ≥ 1, so a units switch cannot ship; the observed range is deliberately not written here, since prose in a dynamic snapshot's manifest must not embed facts a refresh can change"}
  row_count_floor: 9            # exact by construction: the builder asks for
                                # nine economies and validate() asserts the
                                # set. Columns, not rows, are what grow.
  # `end` is the newest year column in the COMMITTED bytes, stamped by
  # scripts/snapshots.py on every refresh — which is what makes a refresh PR's
  # manifest diff self-describing.
  date_range: {start: 1960, end: 2025}

  # Growth is undefined in the series' first year, so YR1960 is empty for all
  # nine economies. validate() additionally allows a null only before an
  # economy's first observation or in the newest two years, never inside a
  # series — none of either exists in this vintage.
  known_nulls: {YR1960: 9}

# ---------------------------------------------------------------------------
# Consumers — how a correction knows what to rebuild
# ---------------------------------------------------------------------------
# None yet. Decided 2026-09-01: lecture-python-intro KEEPS its live wbgapi
# calls (the API is the lesson there), and lecture-wasm — where business_cycle
# is currently excluded from the build because pyodide cannot reach the API —
# will read this file and its two siblings plus us_business_cycle_monthly.csv
# (QuantEcon/lecture-wasm#70). When that repoint lands, record it here with
# `on_refresh: rebuild`, and `cadence` below becomes load-bearing.
consumers: []

builder: builders/business_cycle.py
builder_status: committed       # four-stage since 2026-09-01 (PLAN Phase 5);
                                # `committed` here asserts the builder RUNS and
                                # validates, not that it reproduces the bytes —
                                # a dynamic snapshot is not meant to.

# Dynamic snapshots only. The series is annual; the World Bank revises it
# several times a year but the lecture's figures change materially only when
# a new year lands (WDI typically carries year T from mid T+1).
cadence: annual                 # shared with unemployment_rate_annual.csv and
                                # private_credit_to_gdp.csv, which the same
                                # builder writes in the same run
