# audit_annotations.yml — curated judgment for the data-audit dashboard.
#
# The scanner (build_audit.py) derives every mechanical fact from the lecture
# repos themselves: who reads what, from where, by which URL form. What it
# cannot derive is judgment — what a file contains, how it came to exist, why
# a lecture calls a live API. That lives here, keyed by the scanner's output,
# and the scan warns (or fails with --strict) whenever a NEW reference appears
# with no entry, so this file cannot silently rot.
#
# Migrated datasets (lectures/*.yml manifests) do NOT get entries in
# `datasets:` — the manifest is their source of truth.
#
# provenance values (prior audit §7, feeding manual#108):
#   verbatim              third-party file as distributed; citation is the provenance
#   constructed-committed built by a script/notebook that is committed somewhere
#   constructed-lost      construction documented but the pipeline never committed
#   author-assembled      hand-built by authors; provenance is lecture prose only
#   toy                   invented in-lecture teaching table

datasets:
  graph.txt:
    description: 100-node weighted digraph for the shortest-path problem
    provenance: toy
    note: >
      maintained as %%file blocks in intro, dp, jax and (since
      QuantEcon/lecture-wasm#63) lecture-wasm — every consumer now embeds the
      data in its own lecture, so no repo reads another's copy. wasm used to
      fetch intro's committed copy by URL, which made that copy load-bearing;
      with that read gone graph.txt no longer appears as a scanned dataset at
      all. Two of the four repos also commit a copy the %%file cell overwrites
      before reading (intro, dp) — those are shadowed; jax and wasm commit no
      copy at all, which is the cleaner shape

# ---------------------------------------------------------------------------
# Live-API uses, keyed repo:lecture:access. `pedagogy` says WHY the call is
# live (prior audit §8): "lesson" = the fetch workflow is the teaching point;
# "mixed" = discovery workflow is taught but the plots could read a snapshot;
# "incidental" = the lecture just needs a series — snapshot-ready.
# ---------------------------------------------------------------------------
api:
  lecture-python-intro:business_cycle:wbgapi:
    series: NY.GDP.MKTP.KD.ZG, SL.UEM.TOTL.NE.ZS, FS.AST.PRVT.GD.ZS
    pedagogy: mixed
    note: teaches wb.series.info querying and metadata as part of the narrative
  lecture-python-intro:business_cycle:pandas_datareader:
    series: UNRATE, USREC, M0892AUSM156SNBR, UMCSENT, CPILFESL, INDPRO
    pedagogy: mixed
    note: snapshot pipeline already exists (data-lectures business_cycle_data.csv) but is unadopted
  lecture-python-intro:commod_price:yfinance:
    series: CT=F
    pedagogy: incidental
  lecture-python-intro:heavy_tails:wbgapi:
    series: NY.GDP.MKTP.CD
    pedagogy: incidental
  lecture-python-intro:heavy_tails:yfinance:
    series: AMZN, BTC-USD
    pedagogy: incidental
  lecture-python-intro:inequality:wbgapi:
    series: SI.POV.GINI, NY.GDP.PCAP.KD
    pedagogy: mixed
    note: demonstrates searching for the Gini series ID with wbgapi
  lecture-python-intro:bivariate_dist:yfinance:
    series: AMZN, COST
    pedagogy: incidental
    note: >
      two downloads in a solved exercise, fitting a bivariate normal to monthly
      returns; the lecture points at observed_distributions for the same
      workflow, so the fetch is the illustration's input rather than its lesson
  lecture-python-intro:fitting_distributions:yfinance:
    series: AMZN
    pedagogy: incidental
    note: >
      one download, for the section showing that a normal fit to monthly
      returns fails in the tails
  lecture-python-intro:observed_distributions:yfinance:
    series: AMZN, COST
    pedagogy: incidental
    note: >
      moved here from prob_dist by lecture-python-intro#811, which split the
      observed-data half of that lecture into observed_distributions; prob_dist
      no longer calls yfinance
  lecture-python-programming:pandas:wbgapi:
    series: GC.DOD.TOTL.GD.ZS
    pedagogy: lesson
    note: the section is literally "Using wbgapi and yfinance to Access Data"
  lecture-python-programming:pandas:yfinance:
    series: 11-ticker exercise list
    pedagogy: lesson
  lecture-python-programming:pandas:fredgraph.csv URL:
    series: UNRATE
    pedagogy: lesson
  lecture-python-programming:polars:yfinance:
    series: 11-ticker exercise list
    pedagogy: lesson
    note: mirror of pandas' yfinance exercise, rewritten with pl.DataFrame
  lecture-python-programming:polars:fredgraph.csv URL:
    series: UNRATE
    pedagogy: lesson
    note: mirror of pandas' FRED section — the lesson is pl.read_csv from a URL
  lecture-python.myst:kesten_processes:yfinance:
    series: ^IXIC
    pedagogy: incidental
  lecture-python.myst:phillips_drifts_volatilities:fredgraph.csv URL:
    series: CPIAUCSL, UNRATE, TB3MS
    pedagogy: incidental
    note: >
      splices post-2000Q4 observations onto the Cogley-Sargent sample
      (NEWQDATA.csv) to test whether the extra quarter-century changes the
      findings. Snapshot-ready, but a snapshot would need periodic refresh —
      the section's point is the *latest* vintage
  lecture-python.myst:phillips_lost_conquest:pandas_datareader:
    series: PCEPI, GDPC1, GDPPOT, FEDFUNDS
    pedagogy: incidental
  lecture-python.myst:phillips_two_stories:pandas_datareader:
    series: CPIAUCNS, LNS14000028
    pedagogy: incidental
    note: LNS14000028 is the unemployment rate for white men 20+
  lecture-python.myst:sargent_surico:pandas_datareader:
    series: M2SL, GDPDEF, GDPC1, TB3MS
    pedagogy: incidental
  lecture-python.myst:unemployment_linear:pandas_datareader:
    series: UNRATE
    pedagogy: incidental
  lecture-python.myst:unemployment_shocks:pandas_datareader:
    series: UNRATE
    pedagogy: incidental
  lecture-python-advanced.myst:doubts_or_variability:fredgraph.csv URL:
    series: PCND, PCESV, DPCERD3Q086SBEA, CNP16OV
    pedagogy: incidental
  lecture-python-advanced.myst:subjective_beliefs_business_cycles:fredgraph.csv URL:
    series: USREC
    pedagogy: incidental
  # lecture-wasm mirrors intro's sources; live APIs are the repo's core problem
  # (pyodide cannot reach them — meta#143), so every entry here is a migration
  # target, not an endorsement.
  lecture-wasm:business_cycle:wbgapi:
    series: NY.GDP.MKTP.KD.ZG, SL.UEM.TOTL.NE.ZS, FS.AST.PRVT.GD.ZS
    pedagogy: mixed
    note: mirror of intro's business_cycle; cannot run under pyodide
  lecture-wasm:business_cycle:pandas_datareader:
    series: UNRATE, USREC, M0892AUSM156SNBR, UMCSENT, CPILFESL, INDPRO
    pedagogy: mixed
    note: mirror of intro's business_cycle; cannot run under pyodide
  lecture-wasm:commod_price:yfinance:
    series: CT=F
    pedagogy: incidental
    note: mirror of intro's commod_price
  lecture-wasm:heavy_tails:wbgapi:
    series: NY.GDP.MKTP.CD
    pedagogy: incidental
    note: mirror of intro's heavy_tails
  lecture-wasm:heavy_tails:pandas_datareader:
    series: historical mirror — intro has since moved off pandas_datareader here
    pedagogy: incidental
    note: mirror of an older intro heavy_tails
  lecture-wasm:heavy_tails:yfinance:
    series: AMZN, BTC-USD
    pedagogy: incidental
    note: mirror of intro's heavy_tails
  lecture-wasm:inequality:wbgapi:
    series: SI.POV.GINI, NY.GDP.PCAP.KD
    pedagogy: mixed
    note: mirror of intro's inequality
  lecture-wasm:prob_dist:yfinance:
    series: AMZN, COST
    pedagogy: incidental
    note: mirror of intro's prob_dist

# ---------------------------------------------------------------------------
# Committed data files no code-cell reads, keyed repo:path.
# kind: orphan (dead weight) | shadowed (a %%file cell regenerates it at
# build time) | superseded (lecture reads another copy) | mirror-orphan
# (lecture-wasm copy; the wasm lecture reads intro's URL instead) |
# exercise-download (prose link target — referenced, just not by a code cell)
# ---------------------------------------------------------------------------
committed_unreferenced:
  lecture-python-programming:lectures/_static/lecture_specific/python_advanced_features/test_table.csv:
    kind: exercise-download
    note: prose exercise link tells the reader to download this exact URL — keep
# Scanner-visible targets that are not datasets (tutorial artifacts the
# lecture itself creates, code files, etc.) — suppressed from the audit.
ignore_targets: []
ignore_committed: []
