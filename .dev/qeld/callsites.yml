# qeld call-site worklist — audit snapshot
#
# Generated 2026-08-10 from a source sweep of six lecture repos (40 lectures,
# 115 read sites). Input to PLAN-QELD-PACKAGE.md; see that file for the
# call-site rule (section 4.1), the carve-outs, and the rollout ordering.
#
# THIS IS A SNAPSHOT, NOT A LIVE VIEW. lecture-python-intro and this repo both
# moved during the session that produced it (the A3 french_rev set was
# repointed in #49). REGENERATE BEFORE THE SWEEP.
#
# `repo` is always owner/repo and is never empty. Several lectures exist in
# more than one repo -- heavy_tails.md, long_run_growth.md and french_rev.md
# are each present in lecture-python-intro, lecture-wasm and lecture-intro.zh-cn
# -- so (lecture, filename) is NOT a unique key, and entries differing only by
# repo are distinct call sites rather than duplicates. Repoint rule 2 requires
# the intro/wasm pair be converted together.
#
# action:
#   convert     apply the substitute-in-place rule
#   carve-out   do not convert - see the note
#   blocked     needs a format decision first
#   exclude     not a data-lectures candidate at all
#   downstream  a read of a variable assigned elsewhere; changes by construction
#
# win: indicative only. `structural` means qeld deletes logic, not just shortens
#      a literal. The rollout takes structural sites first.

